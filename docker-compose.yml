version: "3.8"

services:
  data-ingestion:
    build: ./Sensor-Data-Ingestion-Service
    ports:
     - 3500:3500
    depends_on:
      - rabbitmq
    environment:
      NGROK_URL: https://3214-197-204-202-46.ngrok-free.app
      RABBITMQ_URL: amqp://guest:guest@rabbitmq
    command: npm run start
  
  rabbitmq:
    image: rabbitmq:management
    ports:
      - "5672:5672" # RabbitMQ default port
      - "5671:5671"
      - "15672:15672" # RabbitMQ management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    
  gateway:
    build: ./API_gateway
    depends_on:
      - data-ingestion
    ports:
      - "8080:8080"
    environment:
      DATA_INGESTION_URL: http://data-ingestion:3001/api/sensor-data/
      RABBITMQ_URL: amqp://guest:guest@rabbitmq
    command: npm start